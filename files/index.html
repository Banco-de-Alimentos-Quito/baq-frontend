<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago Nuvei — Demo</title>

  <!-- SDK de Nuvei Checkout (requerido para el modal) -->
  <script src="https://cdn.paymentez.com/ccapi/sdk/payment_checkout_3.0.0.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 2px 16px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      margin-bottom: 6px;
    }

    .card p.subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
    }

    .amount-display {
      background: #f8f8f8;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount-display span:first-child { font-size: 14px; color: #555; }
    .amount-display span:last-child  { font-size: 22px; font-weight: 700; color: #111; }

    .btn-pay {
      width: 100%;
      padding: 14px;
      background: #e03030;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-pay:hover:not(:disabled)    { background: #c22828; }
    .btn-pay:active:not(:disabled)   { transform: scale(0.98); }
    .btn-pay:disabled                 { background: #ccc; cursor: not-allowed; }

    .status-box {
      margin-top: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .status-box.show        { display: block; }
    .status-box.processing  { background: #fff8e1; color: #7a5800; border: 1px solid #ffe082; }
    .status-box.success     { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    .status-box.error       { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 24px 0 20px;
    }

    .test-info {
      background: #e3f2fd;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #0d47a1;
    }

    .test-info strong { display: block; margin-bottom: 6px; }
    .test-info code {
      background: rgba(0,0,0,.08);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="card">

  <h2>Donación — Banco de Alimentos</h2>
  <p class="subtitle">Entorno de pruebas (staging)</p>

  <div class="amount-display">
    <span>Total a pagar</span>
    <span id="display-amount">$25.00</span>
  </div>

  <!-- Botón principal -->
  <button class="btn-pay" id="btn-pay" onclick="handlePay()">
    Pagar con tarjeta
  </button>

  <!-- Estado del proceso -->
  <div class="status-box" id="status-box"></div>

  <hr class="divider" />

  <!-- Datos de prueba visibles en staging -->
  <div class="test-info">
    <strong>Tarjetas de prueba (staging)</strong>
    Exitosa: <code>4111111111111111</code><br/>
    Fallida: <code>4242424242424242</code><br/>
    CVV: <code>634</code> &nbsp; Exp: <code>01/28</code>
  </div>

</div>

<script>
  // ── Configuración ───────────────────────────────────────────────────────
  const CONFIG = {
    backendUrl:    'http://localhost:3000',   // URL de tu backend Express
    nuveiEnv:      'stg',                    // 'stg' o 'prod'
    nuveiClientCode: 'NUVEISTG-EC-CLIENT',   // APP_CODE_CLIENT (staging)
  };

  // Datos del pago (en tu app real vendrían del carrito / sesión)
  const PAYMENT = {
    userId:       'user_001',
    userEmail:    'test@ejemplo.com',
    amount:       25.00,
    description:  'Donación Banco de Alimentos',
    devReference: `ORDER-${Date.now()}`,  // ID único por intento de pago
  };

  // ── Inicializar el modal de Nuvei ───────────────────────────────────────
  // Crear UNA sola vez al cargar la página
  const paymentCheckout = new PaymentCheckout.modal({
    env_mode: CONFIG.nuveiEnv,
    conf: {
      style_version: "2",
      theme: {
        logo: "https://cdn.paymentez.com/img/nv/nuvei_logo.png",
        primary_color: "#C800A1"
      }
    },

    onOpen: function () {
      console.log('[nuvei] Modal abierto');
    },

    onClose: function () {
      console.log('[nuvei] Modal cerrado');
      setStatus('', '');
      enableButton();
    },

    onResponse: function (response) {
      // Este callback es preliminar — el resultado oficial llega al webhook
      console.log('[nuvei] onResponse:', response);

      if (response.error) {
        setStatus('error', `Error: ${response.error.description}`);
        enableButton();
        return;
      }

      const tx = response.transaction;
      if (!tx) return;

      if (tx.status === 'success' && tx.status_detail === 3) {
        // Mostrar mensaje optimista — el webhook confirmará definitivamente
        setStatus('success', `
          ✓ Pago procesado. Verificando con el banco...
          <br/><small>Transaction ID: ${tx.id}</small>
        `);
        // Hacer polling al backend para esperar confirmación del webhook
        pollOrderStatus(PAYMENT.devReference);
      } else {
        setStatus('error', `Pago no completado. Estado: ${tx.status} (detalle: ${tx.status_detail})`);
        enableButton();
      }
    },
  });

  // ── Paso 1: click en el botón ──────────────────────────────────────────
  // NO llamar paymentCheckout.open() dentro de un callback async —
  // el navegador bloquea popups no iniciados directamente por el usuario.
  // Estrategia: fetch al backend, luego abrir el modal de inmediato con la ref.

  async function handlePay() {
    disableButton('Iniciando pago...');
    setStatus('processing', 'Conectando con el procesador de pagos...');

    try {
      // ── Paso 2: backend genera la referencia en Nuvei ────────────────
      const res = await fetch(`${CONFIG.backendUrl}/api/payments/init`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId:       PAYMENT.userId,
          userEmail:    PAYMENT.userEmail,
          amount:       PAYMENT.amount,
          description:  PAYMENT.description,
          devReference: PAYMENT.devReference,
        }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Error del servidor');
      }

      const { reference } = await res.json();
      console.log('[nuvei] Reference obtenida:', reference);

      // ── Paso 3: abrir el modal con la referencia ─────────────────────
      setStatus('processing', 'Abriendo ventana de pago...');
      paymentCheckout.open({ reference });

    } catch (err) {
      console.error('[handlePay] Error:', err);
      setStatus('error', `No se pudo iniciar el pago: ${err.message}`);
      enableButton();
    }
  }

  // ── Polling: verificar si el webhook ya llegó ───────────────────────────
  async function pollOrderStatus(devReference, attempts = 0) {
    if (attempts > 10) {
      setStatus('success', '✓ Pago enviado. Recibirás un email de confirmación pronto.');
      enableButton();
      return;
    }

    await sleep(2000); // esperar 2s entre intentos

    try {
      const res  = await fetch(`${CONFIG.backendUrl}/api/payments/status/${devReference}`);
      const data = await res.json();

      if (data.status === 'paid') {
        setStatus('success', '✓ ¡Pago confirmado! Revisa tu correo electrónico.');
        enableButton();
      } else if (data.status === 'failed') {
        setStatus('error', 'El pago fue rechazado. Intenta con otra tarjeta.');
        enableButton();
      } else {
        // Todavía pendiente — seguir haciendo polling
        pollOrderStatus(devReference, attempts + 1);
      }
    } catch (_) {
      pollOrderStatus(devReference, attempts + 1);
    }
  }

  // ── Helpers UI ─────────────────────────────────────────────────────────
  function setStatus(type, message) {
    const box = document.getElementById('status-box');
    box.className = `status-box ${type} ${message ? 'show' : ''}`;
    box.innerHTML = message;
  }

  function disableButton(text) {
    const btn = document.getElementById('btn-pay');
    btn.disabled = true;
    btn.textContent = text;
  }

  function enableButton() {
    const btn = document.getElementById('btn-pay');
    btn.disabled = false;
    btn.textContent = 'Pagar con tarjeta';
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }
</script>

</body>
</html>
